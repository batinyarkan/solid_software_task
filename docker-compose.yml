services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U shop -d shop"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    init: true
    environment:
      DATABASE_URL: postgresql+psycopg2://shop:shop@db:5432/shop
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
